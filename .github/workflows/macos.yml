name: Build Mac application
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-macos.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/*.cjs
      - name: Handwriting regression checks
        working-directory: handwriting-capture
        run: |
          python -m unittest discover -s tests -v
          node --test tests/*.cjs
      - run: python packaging/build_macos.py
      - run: '"dist/SVG Plotter.app/Contents/MacOS/SVG Plotter" --smoke-test'
      - uses: actions/upload-artifact@v4
        with:
          name: SVG-Plotter-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
